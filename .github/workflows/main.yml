name: Selenium & Appium Automation

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Google Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Install ChromeDriver
        uses: nanasess/setup-chromedriver@v2

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r selenium_model/requirements.txt

      - name: Verify Chrome
        run: |
          google-chrome --version
          chromedriver --version

      - name: Run Selenium Tests
        working-directory: selenium_model
        run: |
          pytest tests/ \
            --html=reports/report.html \
            --self-contained-html \
            --junitxml=reports/junit.xml

      - name: Upload HTML Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-report
          path: selenium_model/reports/

  appium-tests:
    runs-on: ubuntu-latest
    if: false

    steps:
      - name: Placeholder
        run: |
          echo "Appium tests require a real Android device or emulator."
          echo "Enable this job when using a self-hosted runner."
