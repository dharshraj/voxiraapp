name: VoxiraApp Full Suite (Manual — includes Appium)

# Trigger manually from GitHub Actions UI
# Requires a self-hosted runner on your local machine with:
#   - Appium running at localhost:4723
#   - Android device connected via USB
#   - Expo Go installed on device
#   - npx expo start running

on:
  workflow_dispatch:
    inputs:
      expo_lan_url:
        description: 'Expo LAN URL for Expo Go (e.g. exp://172.23.50.100:8081)'
        required: true
        default: 'exp://172.23.50.100:8081'

jobs:
  full-test:
    name: Full 319-test suite
    runs-on: self-hosted   # Must register your PC as a GitHub Actions runner
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      VOXIRA_TEST_EMAIL:    ${{ secrets.VOXIRA_TEST_EMAIL }}
      VOXIRA_TEST_PASSWORD: ${{ secrets.VOXIRA_TEST_PASSWORD }}
      VOXIRA_BASE_URL:     http://localhost:8081
      VOXIRA_HEADLESS:     "0"
      VOXIRA_WINDOW_WIDTH: "1440"
      VOXIRA_WINDOW_HEIGHT: "1024"
      VOXIRA_BROWSER:      chrome
      APPIUM_SERVER_URL:   http://localhost:4723
      ANDROID_DEVICE_NAME: 10BD6G2LZ0000FK
      ANDROID_PLATFORM_VERSION: "15"
      ANDROID_USE_EXPO_GO: "1"
      EXPO_LAN_URL:        ${{ github.event.inputs.expo_lan_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - name: Run full test suite
        working-directory: selenium_model
        run: |
          python -m pytest tests/ \
            -v --tb=short \
            --html=reports/html/execution_report.html \
            --self-contained-html \
            -q
        continue-on-error: true

      - name: Generate Excel report
        working-directory: selenium_model
        run: python audit/generate_report.py
        continue-on-error: true

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-suite-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/REALTIME_TEST_PROGRESS.xlsx
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/reports/test_results.json
          retention-days: 90
