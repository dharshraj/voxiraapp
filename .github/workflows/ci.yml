name: VoxiraApp CI — Unit + API + Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── JOB 1: Unit + API tests — no browser, no Expo needed ─────────────────
  unit-and-api:
    name: "Unit + API tests (88)"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      VOXIRA_TEST_EMAIL:             ${{ secrets.VOXIRA_TEST_EMAIL }}
      VOXIRA_TEST_PASSWORD:          ${{ secrets.VOXIRA_TEST_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - name: Write .env
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n'      "$EXPO_PUBLIC_SUPABASE_URL"      > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env

      - name: Unit tests (55)
        working-directory: selenium_model
        run: |
          python -m pytest tests/test_unit.py \
            -v --tb=short \
            --html=reports/html/unit_report.html \
            --self-contained-html

      - name: API tests (33)
        working-directory: selenium_model
        run: |
          python -m pytest \
            tests/test_api_validation.py \
            tests/test_api_extended.py \
            -v --tb=short \
            --html=reports/html/api_report.html \
            --self-contained-html
        continue-on-error: true

      - name: Upload unit+API reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-api-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/reports/test_results.json
          retention-days: 30

  # ── JOB 2: Selenium tests — requires Expo web server ─────────────────────
  selenium:
    name: "Selenium tests (201)"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: unit-and-api   # Run after unit tests pass

    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      VOXIRA_TEST_EMAIL:             ${{ secrets.VOXIRA_TEST_EMAIL }}
      VOXIRA_TEST_PASSWORD:          ${{ secrets.VOXIRA_TEST_PASSWORD }}
      VOXIRA_BASE_URL:               http://localhost:8081
      VOXIRA_HEADLESS:               "1"
      VOXIRA_WINDOW_WIDTH:           "1440"
      VOXIRA_WINDOW_HEIGHT:          "1024"
      VOXIRA_BROWSER:                chrome
      VOXIRA_IMPLICIT_WAIT:          "3"
      VOXIRA_EXPLICIT_WAIT:          "15"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Write .env
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n'      "$EXPO_PUBLIC_SUPABASE_URL"      > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env

      # Build static web bundle — use --no-bytecode to avoid Metro issues
      - name: Export Expo web bundle
        run: |
          npx expo export --platform web --output-dir /tmp/dist-web 2>&1
          ls /tmp/dist-web/
        timeout-minutes: 10
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"

      - name: Serve app on :8081
        run: |
          npm install -g serve@14
          serve -s /tmp/dist-web -l 8081 &
          for i in $(seq 1 15); do
            curl -sf http://localhost:8081 > /dev/null 2>&1 && echo "Server ready" && break
            echo "Attempt $i — waiting..."
            sleep 2
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Selenium tests (headless Chrome)
        working-directory: selenium_model
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_validation.py \
            tests/test_navigation.py \
            tests/test_navigation_extended.py \
            tests/test_auth.py \
            tests/test_auth_extended.py \
            tests/test_e2e_flows.py \
            tests/test_performance.py \
            tests/test_ui_extended.py \
            tests/test_vulnerability.py \
            tests/test_accessibility_and_ui.py \
            tests/test_broken_links.py \
            -v --tb=short \
            --html=reports/html/execution_report.html \
            --self-contained-html \
            -n 2
        continue-on-error: true

      - name: Generate Excel report
        working-directory: selenium_model
        run: python audit/generate_report.py
        continue-on-error: true

      - name: Upload Selenium reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selenium-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/REALTIME_TEST_PROGRESS.xlsx
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/reports/test_results.json
          retention-days: 30

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-${{ github.run_number }}
          path: selenium_model/reports/screenshots/
          retention-days: 7

      - name: Print summary
        working-directory: selenium_model
        if: always()
        run: |
          python -c "
          import json; from pathlib import Path
          f = Path('reports/test_results.json')
          if f.exists():
              d = json.loads(f.read_text())
              t = len(d)
              p = sum(1 for r in d if r['status']=='Passed')
              fa = sum(1 for r in d if r['status']=='Failed')
              s = sum(1 for r in d if r['status']=='Skipped')
              rate = round(100*p/t,1) if t else 0
              print(f'')
              print(f'==============================')
              print(f'  RESULTS: {p}/{t} passed ({rate}%)')
              print(f'  Failed: {fa} | Skipped: {s}')
              print(f'==============================')
          else:
              print('No results file')
          "
