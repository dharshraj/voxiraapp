name: VoxiraApp — Test Results

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  upload-results:
    name: Upload latest test reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Upload Excel report
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/REALTIME_TEST_PROGRESS.xlsx
            selenium_model/reports/test_results.json
            selenium_model/reports/html/
          retention-days: 90
          if-no-files-found: warn
