name: VoxiraApp CI — Unit + API + Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Cancel in-progress runs on the same branch when a new push arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run 289 automated tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      # ── Supabase (public keys only — safe to expose) ──────────────────────
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      # ── QA test account ───────────────────────────────────────────────────
      VOXIRA_TEST_EMAIL:    ${{ secrets.VOXIRA_TEST_EMAIL }}
      VOXIRA_TEST_PASSWORD: ${{ secrets.VOXIRA_TEST_PASSWORD }}
      # ── Selenium config ───────────────────────────────────────────────────
      VOXIRA_BASE_URL:     http://localhost:8081
      VOXIRA_HEADLESS:     "1"
      VOXIRA_WINDOW_WIDTH: "1440"
      VOXIRA_WINDOW_HEIGHT: "1024"
      VOXIRA_BROWSER:      chrome
      VOXIRA_IMPLICIT_WAIT: "3"
      VOXIRA_EXPLICIT_WAIT: "15"

    steps:
      # ── 1. Checkout ────────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Node.js (for Expo web server) ──────────────────────────────────
      - name: Set up Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      # ── 3. Start Expo web server in background ────────────────────────────
      - name: Start Expo web server
        run: |
          npx expo export --platform web --output-dir dist-web 2>&1 | tail -5 &
          npx expo start --web --non-interactive &
          echo "Waiting for Expo web server..."
          timeout 60 bash -c 'until curl -sf http://localhost:8081 > /dev/null 2>&1; do sleep 2; done'
          echo "Expo server ready at localhost:8081"

      # ── 4. Python ─────────────────────────────────────────────────────────
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      # ── 5. Chrome (headless) ──────────────────────────────────────────────
      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # ── 6. Write .env for Python tests ────────────────────────────────────
      - name: Write .env for Supabase connection
        run: |
          echo "EXPO_PUBLIC_SUPABASE_URL=$EXPO_PUBLIC_SUPABASE_URL" > .env
          echo "EXPO_PUBLIC_SUPABASE_ANON_KEY=$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env

      # ── 7. Run unit tests (no browser, fast) ──────────────────────────────
      - name: Run unit tests
        working-directory: selenium_model
        run: |
          python -m pytest tests/test_unit.py \
            -v --tb=short \
            --html=reports/html/unit_report.html \
            --self-contained-html \
            -q
        continue-on-error: false

      # ── 8. Run API validation tests ────────────────────────────────────────
      - name: Run API tests
        working-directory: selenium_model
        run: |
          python -m pytest tests/test_api_validation.py tests/test_api_extended.py \
            -v --tb=short \
            --html=reports/html/api_report.html \
            --self-contained-html \
            -q
        continue-on-error: true   # Supabase may rate-limit in CI

      # ── 9. Run Selenium tests ─────────────────────────────────────────────
      - name: Run Selenium tests (headless Chrome)
        working-directory: selenium_model
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_validation.py \
            tests/test_navigation.py \
            tests/test_navigation_extended.py \
            tests/test_auth.py \
            tests/test_auth_extended.py \
            tests/test_e2e_flows.py \
            tests/test_performance.py \
            tests/test_ui_extended.py \
            tests/test_vulnerability.py \
            tests/test_accessibility_and_ui.py \
            tests/test_broken_links.py \
            -v --tb=short \
            --html=reports/html/execution_report.html \
            --self-contained-html \
            -n 2 \
            -q
        continue-on-error: true   # Report failures but don't block merge

      # ── 10. Generate Excel audit report ────────────────────────────────────
      - name: Generate Excel report
        working-directory: selenium_model
        run: python audit/generate_report.py
        continue-on-error: true

      # ── 11. Upload test artifacts ─────────────────────────────────────────
      - name: Upload test reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/REALTIME_TEST_PROGRESS.xlsx
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/reports/test_results.json
          retention-days: 30

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: screenshots-${{ github.run_number }}
          path: selenium_model/reports/screenshots/
          retention-days: 7

      # ── 12. Print summary ─────────────────────────────────────────────────
      - name: Print test summary
        working-directory: selenium_model
        if: always()
        run: |
          python -c "
          import json
          from pathlib import Path
          f = Path('reports/test_results.json')
          if f.exists():
              data = json.loads(f.read_text())
              total   = len(data)
              passed  = sum(1 for r in data if r['status'] == 'Passed')
              failed  = sum(1 for r in data if r['status'] == 'Failed')
              skipped = sum(1 for r in data if r['status'] == 'Skipped')
              rate    = round(100*passed/total, 1) if total else 0
              print(f'')
              print(f'================================')
              print(f'  TEST RESULTS SUMMARY')
              print(f'================================')
              print(f'  Total:   {total}')
              print(f'  Passed:  {passed}')
              print(f'  Failed:  {failed}')
              print(f'  Skipped: {skipped}')
              print(f'  Rate:    {rate}%')
              print(f'================================')
          else:
              print('No test_results.json found')
          "
