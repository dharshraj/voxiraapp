name: VoxiraApp CI — Unit + API + Selenium Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-tests:
    name: Unit + API tests (fast, blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - name: Unit tests (pure Python, no browser)
        working-directory: selenium_model
        run: |
          python -m pytest tests/test_unit.py \
            -v --tb=short -q \
            --html=reports/html/unit_report.html \
            --self-contained-html

      - name: API + security-scan tests (HTTP only, no browser)
        working-directory: selenium_model
        run: |
          python -m pytest \
            tests/test_api_validation.py \
            tests/test_api_extended.py \
            "tests/test_vulnerability.py::test_vuln_011_no_hardcoded_groq_api_key" \
            "tests/test_vulnerability.py::test_vuln_012_no_hardcoded_supabase_service_role_key" \
            "tests/test_vulnerability.py::test_vuln_013_assemblyai_key_only_in_env" \
            "tests/test_vulnerability.py::test_vuln_014_no_private_key_pem_in_source" \
            "tests/test_vulnerability.py::test_vuln_015_no_jwt_secret_hardcoded" \
            "tests/test_vulnerability.py::test_vuln_016_no_password_hardcoded_in_source" \
            "tests/test_vulnerability.py::test_vuln_020_supabase_uses_https" \
            "tests/test_vulnerability.py::test_vuln_021_no_eval_usage_in_source" \
            "tests/test_vulnerability.py::test_vuln_022_no_dangerouslysetinnerhtml" \
            "tests/test_vulnerability.py::test_vuln_023_client_direct_assemblyai_key_is_env_var" \
            "tests/test_vulnerability.py::test_vuln_024_no_console_log_of_passwords" \
            -v --tb=short -q \
            --html=reports/html/api_report.html \
            --self-contained-html

      - name: Upload fast-test artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fast-test-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/reports/test_results.json
          retention-days: 30

  selenium-tests:
    name: Selenium browser tests (blocking)
    runs-on: ubuntu-latest
    needs: fast-tests
    timeout-minutes: 60

    env:
      EXPO_PUBLIC_SUPABASE_URL:      ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
      VOXIRA_TEST_EMAIL:             ${{ secrets.VOXIRA_TEST_EMAIL }}
      VOXIRA_TEST_PASSWORD:          ${{ secrets.VOXIRA_TEST_PASSWORD }}
      VOXIRA_BASE_URL:               http://localhost:8081
      VOXIRA_HEADLESS:               "1"
      VOXIRA_WINDOW_WIDTH:           "1440"
      VOXIRA_WINDOW_HEIGHT:          "1024"
      VOXIRA_BROWSER:                chrome
      VOXIRA_IMPLICIT_WAIT:          "3"
      VOXIRA_EXPLICIT_WAIT:          "15"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci

      - name: Write .env so Expo export bakes in the Supabase keys
        run: |
          printf 'EXPO_PUBLIC_SUPABASE_URL=%s\n'      "$EXPO_PUBLIC_SUPABASE_URL"      > .env
          printf 'EXPO_PUBLIC_SUPABASE_ANON_KEY=%s\n' "$EXPO_PUBLIC_SUPABASE_ANON_KEY" >> .env

      - name: Build Expo web bundle
        run: npx expo export --platform web --output-dir dist-web
        timeout-minutes: 10

      - name: Serve web bundle on :8081
        run: |
          npm install -g serve@14
          nohup serve -s dist-web -l 8081 &
          npx wait-on http://localhost:8081 --timeout 30000

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: selenium_model/requirements.txt

      - name: Install Python dependencies
        run: pip install -r selenium_model/requirements.txt

      - uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Selenium + vulnerability + validation + navigation + UI + E2E tests
        working-directory: selenium_model
        run: |
          python -m pytest \
            tests/test_smoke.py \
            tests/test_validation.py \
            tests/test_navigation.py \
            tests/test_navigation_extended.py \
            tests/test_auth.py \
            tests/test_auth_extended.py \
            tests/test_e2e_flows.py \
            tests/test_performance.py \
            tests/test_ui_extended.py \
            tests/test_vulnerability.py \
            tests/test_accessibility_and_ui.py \
            tests/test_broken_links.py \
            tests/test_extended_coverage.py \
            -v --tb=short -q \
            --html=reports/html/execution_report.html \
            --self-contained-html

      - name: Locust load test (headless, short)
        if: always()
        working-directory: selenium_model
        run: |
          python -m locust -f locust_load.py --headless \
            --users 20 --spawn-rate 5 --run-time 30s \
            --host http://localhost:8081 \
            --html reports/locust_report.html \
            --csv reports/locust
        continue-on-error: true

      - name: Generate Excel reports (multi-sheet + flat 1000+ rows)
        if: always()
        working-directory: selenium_model
        run: |
          python audit/generate_report.py
          python audit/generate_flat_report.py

      - name: Upload test reports + Excel workbooks
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: full-test-reports-${{ github.run_number }}
          path: |
            selenium_model/reports/html/
            selenium_model/reports/locust_report.html
            selenium_model/MASTER_TEST_AUDIT_REPORT.xlsx
            selenium_model/ALL_TEST_CASES_FLAT_REPORT.xlsx
            selenium_model/reports/test_results.json
          retention-days: 30

      - name: Upload failure screenshots
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failure-screenshots-${{ github.run_number }}
          path: selenium_model/reports/screenshots/
          retention-days: 14
