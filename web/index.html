<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />

    <!-- App metadata -->
    <title>Voxira — Communication Coach</title>
    <meta name="description" content="Improve your speech, writing, and interview skills with AI-powered coaching." />
    <meta name="theme-color" content="#4F6EF7" />

    <!-- Inter font — loaded as <link> so it doesn't block the CSS injection path -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!--
      WEB LAYOUT FIX (production builds only — see note below)
      ═══════════════════════════════════════════════════════════════════════
      IMPORTANT: `expo start --web` (the dev server) does NOT serve this
      file — it always uses its own generic built-in HTML shell, regardless
      of app.json's `web.htmlTemplate` setting. This file is only used by
      `expo export --platform web` (the production static build in `dist/`,
      what render.yaml/vercel.json deploy). The actual fix that takes effect
      during normal development lives in App.tsx (the JS-injected <style id="vx-web">
      block), because that runs as part of the bundle in both dev and
      production. Keep both in sync — this copy exists purely so the
      production build's initial HTML paint (before the JS bundle evaluates)
      already has correct layout CSS instead of a brief unstyled flash.

      Root cause of the "can't scroll" bug:

      React Navigation nests screen content inside many <div> layers:
        #root → SafeAreaProvider → GestureHandlerRootView →
        NavigationContainer → BottomTabNavigator → StackNavigator →
        Screen → component root View → ScrollView

      CSS flex items default to `min-height: auto`, which means they REFUSE
      to shrink below their content height even inside a bounded parent.
      Without `min-height: 0` on the intermediate wrapper divs, one of them
      grows to full content height instead of being capped at the viewport,
      so the ScrollView further down never receives a bounded box to
      compute overflow against — the extra content is simply cut off at the
      html/body overflow:hidden boundary instead of becoming scrollable.

      Fix: `#root div { min-height: 0 }` cascades that ONE property to every
      div inside #root, regardless of nesting depth.

      IMPORTANT — do NOT also force `display`, `flex-direction`, or
      `overflow` on every div here. react-native-web already emits the
      correct flex-direction/display for each element via its own atomic
      CSS classes (reflecting each component's real `style={{flexDirection}}`
      prop). A previous version of this fix forced `flex-direction: column`
      globally would (because an ID selector always beats react-native-web's
      class-based atomic rules) silently override every `flexDirection: 'row'`
      layout in the app — so this rule only ever sets `flex-grow`/`flex-shrink`
      /`min-height`, never `flex-direction` or `display`, and only reaches a
      bounded number of nesting levels (deep enough for this app's actual
      navigator nesting, not "every div anywhere").

      Keep this block's CSS text identical to the one in App.tsx.
      ═══════════════════════════════════════════════════════════════════════
    -->
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
        background: #121316;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      #root {
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      /* THE KEY FIX. min-height:0 lets every wrapper shrink to its bounded
         box instead of expanding to content height (needed everywhere, safe
         everywhere — it only affects the *minimum*, never layout direction). */
      #root div {
        min-height: 0;
      }

      /* flex-grow/flex-shrink alone (never flex-direction/display) chained
         down through the known navigator wrapper depth (SafeAreaProvider >
         GestureHandlerRootView > NavigationContainer > Tab/Stack navigator >
         Screen > screen root view > ScrollView, plus headroom). This is what
         actually gives each level a *bounded* height to measure against —
         min-height:0 alone only allows shrinking, it doesn't establish the
         bound. Scoped to this fixed depth (not every div) so it can't touch
         unrelated leaf elements like icons/badges/buttons elsewhere in the
         tree that intentionally size to their own content. */
      #root > div,
      #root > div > div,
      #root > div > div > div,
      #root > div > div > div > div,
      #root > div > div > div > div > div,
      #root > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div > div > div > div > div,
      #root > div > div > div > div > div > div > div > div > div > div > div > div {
        flex-grow: 1;
        flex-shrink: 1;
      }

      /* Global helpers */
      * {
        box-sizing: border-box;
        -webkit-overflow-scrolling: touch;
      }

      /* Thin scrollbar for web ScrollViews */
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: rgba(79, 110, 247, 0.30); border-radius: 2px; }
      ::-webkit-scrollbar-thumb:hover { background: rgba(79, 110, 247, 0.60); }

      ::selection { background: rgba(79, 110, 247, 0.18); }
      input:focus { outline: none; }
    </style>

    <!--EXPO-HEAD-->
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
