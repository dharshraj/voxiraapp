[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --tb=short
timeout = 120

markers =
    appium: marks tests that require an Appium server and device/emulator
    appium_platform: marks the target platform (android | ios)
    slow: marks tests that take more than 10 seconds
    authenticated: marks tests that require VOXIRA_TEST_EMAIL to be set
